services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: sportscards
      POSTGRES_PASSWORD: sportscards
      POSTGRES_DB: sportscards
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportscards"]
      interval: 5s
      timeout: 3s
      retries: 10

  prefect:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_UI_API_URL: http://localhost:4200/api
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
