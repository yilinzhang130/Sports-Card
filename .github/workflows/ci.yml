name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: sportscards
          POSTGRES_PASSWORD: sportscards
          POSTGRES_DB: sportscards
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sportscards"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://sportscards:sportscards@localhost:5432/sportscards

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Alembic migrations
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest tests/
