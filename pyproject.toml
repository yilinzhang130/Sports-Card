[project]
name = "sportscards-quant"
version = "0.1.0"
description = "Quantitative sports card trading — Phase 1 data layer (NBA)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "prefect>=3.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",
    "click>=8.1",
    "pandas>=2.2",
    "numpy>=2.0",
    "rich>=13.8",
    "xgboost>=2.0",
    "optuna>=3.6",
    "joblib>=1.4",
    "scikit-learn>=1.5",
    "catboost>=1.2",
    "pyarrow>=17.0",
    "streamlit>=1.39",
    "jinja2>=3.1",
    "plotly>=5.24",
]

[project.optional-dependencies]
scouting-live = [
    # Pulled only for the live NBA ingest path. Both libraries are known to
    # break when the upstream source changes; tests inject a fake client so
    # the test suite does not require these deps.
    "basketball-reference-scraper>=1.0.6",
    # NBA's "unofficial official" stats API; we use the DraftCombineStats
    # endpoint. The raw stats.nba.com endpoint requires specific headers and
    # connection handling that this library encapsulates.
    "nba_api>=1.4",
]
events-live = [
    # Pulled only for the live NBA catalyst-event ingest path (injuries,
    # schedule, awards, transactions). Tests inject fake clients so the test
    # suite does not require this dep.
    "nba_api>=1.4",
]

[project.scripts]
sportscards = "sportscards.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sportscards"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
    "pre-commit>=3.8",
    "pandas-stubs",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# click/prefect/tenacity decorators aren't typed; scope the relaxation to the
# modules that actually use them so the rest of the tree stays strict.
[[tool.mypy.overrides]]
module = [
    "sportscards.cli.*",
    "sportscards.flows.*",
    "sportscards.ingest.*",
    "sportscards.scouting.*",
]
disallow_untyped_decorators = false

# Third-party libs without type stubs.
[[tool.mypy.overrides]]
module = [
    "catboost.*",
    "basketball_reference_scraper.*",
    "joblib",
    "sklearn.*",
    "xgboost",
    "xgboost.*",
    "optuna",
    "optuna.*",
    "nba_api.*",
]
ignore_missing_imports = true

# Pre-existing mypy errors in Phase 2A factors code (merged on main before CI
# enforced mypy). Skipping here so unrelated PRs aren't blocked; remove this
# block once factors/* is type-clean (tracked separately).
[[tool.mypy.overrides]]
module = ["sportscards.factors.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
