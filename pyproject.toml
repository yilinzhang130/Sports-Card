[project]
name = "sportscards-quant"
version = "0.1.0"
description = "Quantitative sports card trading — Phase 1 data layer (NBA)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "prefect>=3.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",
    "click>=8.1",
    "pandas>=2.2",
    "rich>=13.8",
]

[project.scripts]
sportscards = "sportscards.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sportscards"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
    "pre-commit>=3.8",
    "pandas-stubs",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# click/prefect/tenacity decorators aren't typed; scope the relaxation to the
# modules that actually use them so the rest of the tree stays strict.
[[tool.mypy.overrides]]
module = ["sportscards.cli.*", "sportscards.flows.*", "sportscards.ingest.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
