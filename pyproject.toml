[project]
name = "sportscards-quant"
version = "0.1.0"
description = "Quantitative sports card trading — Phase 1 data layer (NBA)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "prefect>=3.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",
    "click>=8.1",
    "pandas>=2.2",
    "rich>=13.8",
    "catboost>=1.2",
    "pyarrow>=17.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
scouting-live = [
    # Pulled only for the live NBA ingest path. The library is known to break
    # when Basketball-Reference's HTML changes; tests inject a fake client so
    # the test suite does not require this dep.
    "basketball-reference-scraper>=1.0.6",
]

[project.scripts]
sportscards = "sportscards.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sportscards"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
